name: Generator delivery and reference-role qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generator-roles:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Acquire pinned validation tooling
        run: nix develop --no-update-lock-file -c bash scripts/tooling.sh setup-starlark
      - name: Validate tools and owned code
        run: |
          nix develop --no-update-lock-file -c bash scripts/check.sh
          nix develop --no-update-lock-file -c bash scripts/check-dotnet.sh
      - name: Generator and analyzer acceptance
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/generator_roles -v
      - name: Package payload integrity controls
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/graph_packages -p test_analyzer_packages.py -v
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-role-evidence
          path: |
            ${{ runner.temp }}/generator-roles-native-*/probe/report.json
            ${{ runner.temp }}/generator-roles-native-*/probe/*.log
            ${{ runner.temp }}/generator-roles-native-*/probe/evidence/**
            ${{ runner.temp }}/generator-combinations-*/**/report.json
            ${{ runner.temp }}/generator-combinations-*/*/*.log
            ${{ runner.temp }}/generator-combinations-*/*/evidence/**
            ${{ runner.temp }}/generator-role-restore-*/*/*.log
            ${{ runner.temp }}/generator-roles-ordinary-*/*.log
