name: Optional Nix development shell
# Run GitHub CI only when explicitly requested.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    # Native Bazel sandboxing needs unprivileged user namespaces.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Acquire pinned Starlark validation tool
        run: nix develop --no-update-lock-file -c bash scripts/tooling.sh setup-starlark
      - name: Check pinned tools
        run: nix develop --no-update-lock-file -c bash scripts/check.sh
      - name: Development environment checks
        run: nix develop --no-update-lock-file -c bash scripts/ci-linux.sh quick
      - name: Retain available check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nix-explicit-evidence
          path: /tmp/**/msbuild-explicit-ci.*/**
          if-no-files-found: ignore
