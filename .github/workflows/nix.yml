name: Nix development shell
on:
  push:
    branches-ignore: ['codex/ready-tracks']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    # Native Bazel sandboxing needs unprivileged user namespaces.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Acquire pinned Starlark validation tool
        run: nix develop --no-update-lock-file -c python3 scripts/setup-starlark.py
      - name: Check pinned tools
        run: nix develop --no-update-lock-file -c bash scripts/check.sh
      - name: Load Bazel scaffold
        run: nix develop --no-update-lock-file -c bash scripts/bazel.sh query //:repo_setup --noshow_progress
      - name: Action runner contracts
        run: nix develop --no-update-lock-file -c bash scripts/dotnet.sh run --project tests/ActionRunner.Tests -c Release
      - name: MSBuild boundary e2e tests
        env:
          TMPDIR: ${{ runner.temp }}
          SPIKE_NATIVE_RUNTIME_TEST: "1"
          SPIKE_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/native-runtime-evidence
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/e2e -v
      - name: Retain native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-evidence
          path: ${{ runner.temp }}/native-runtime-evidence
          if-no-files-found: ignore
      - name: Retain binary package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-binary-package-evidence
          path: |
            ${{ runner.temp }}/msbuild-e2e-binary-*/probe/*.log
            ${{ runner.temp }}/msbuild-e2e-binary-*/probe/report.json
          if-no-files-found: ignore
      - name: Retain failed experiment logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nix-msbuild-e2e-failures
          path: |
            ${{ runner.temp }}/msbuild-e2e-*/**/*.log
            ${{ runner.temp }}/msbuild-e2e-*/**/report.json
          if-no-files-found: ignore
