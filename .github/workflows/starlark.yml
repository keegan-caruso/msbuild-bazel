name: Starlark and local adapter qualification
on:
  pull_request:
  push:
    branches: [main, 'codex/starlark-core']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  starlark-core:
    # Active acceptance lane; Linux qualification remains deferred.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Acquire pinned Buildifier
        run: nix develop --no-update-lock-file -c python3 scripts/setup-starlark.py
      - name: Check tracked Starlark and pinned tools
        run: nix develop --no-update-lock-file -c bash scripts/check.sh
      - name: Analysis, generated workspace and repository contracts
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/starlark -v
      - name: Package, configuration and test generated-workspace contracts
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/starlark_extensions -v
      - name: Managed graph cache and package behavior
        run: |
          nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/graph_cache_full -v
          nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/graph_packages -v
      - name: Configured graph behavior
        run: |
          nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/configured_execution -v
      - name: Checkout pinned Serilog input
        uses: actions/checkout@v4
        with:
          repository: serilog/serilog
          ref: 49b5339ce85385dc52d4d8e8f2b8308becf23506
          path: artifacts/serilog-upstream
          persist-credentials: false
      - name: Acquire selected Serilog and generator-mutation packages
        run: |
          nix develop --no-update-lock-file -c bash scripts/dotnet.sh msbuild artifacts/serilog-upstream/test/Serilog.ApprovalTests/Serilog.ApprovalTests.csproj -t:Restore -p:Configuration=Release -p:TargetFramework=net10.0 -p:RestorePackagesPath="${{ runner.temp }}/serilog-packages" -nodeReuse:false -nologo
          mkdir -p artifacts/r04-generator-acquisition
          cat > artifacts/r04-generator-acquisition/Upgrade.csproj <<'PROJECT'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="PolySharp" Version="1.16.0" /></ItemGroup></Project>
          PROJECT
          nix develop --no-update-lock-file -c bash scripts/dotnet.sh restore artifacts/r04-generator-acquisition/Upgrade.csproj --packages "${{ runner.temp }}/serilog-packages"
      - name: Pinned Serilog library and unchanged approval Build/Test
        env:
          RULES_MSBUILD_SERILOG_SOURCE: ${{ github.workspace }}/artifacts/serilog-upstream
          RULES_MSBUILD_SERILOG_PACKAGES: ${{ runner.temp }}/serilog-packages
          RULES_MSBUILD_SERILOG_NATIVE_TESTS: '1'
        run: |
          nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/serilog_adapter -v
          nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/test_action -v
          nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/serilog_tests -v
      - name: Comparative measurement protocol checks
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/serilog_performance -v
      - name: Existing SDK repository controls
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/sdk_repository -v
      - name: Native explicit-adapter generation and cache acceptance
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/starlark_native -v
      - name: Generated build-package rejection regression
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/e2e -p test_bazel_boundary.py -k test_pinned_package_inputs -v
      - name: Generated binary-package rejection regression
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/e2e -p test_binary_packages.py -v
      - name: Native graph cache and replay controls
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/graph_cache -v
      - name: Graph discovery and forced replay controls
        run: nix develop --no-update-lock-file -c python3 -m unittest discover -s tests/graph_handoff -v
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starlark-core-evidence
          path: |
            ${{ runner.temp }}/serilog-adapter-*/probe/*.log
            ${{ runner.temp }}/serilog-adapter-*/probe/report.json
            ${{ runner.temp }}/serilog-adapter-*/probe/evidence/**/*.log
            ${{ runner.temp }}/serilog-native-tests-*/probe/*.log
            ${{ runner.temp }}/serilog-native-tests-*/probe/report.json
            ${{ runner.temp }}/serilog-native-tests-*/probe/evidence/**/testlogs/**
            ${{ runner.temp }}/serilog-test-ordinary-*/probe/**/*.trx
            ${{ runner.temp }}/serilog-test-ordinary-*/probe/*.log
            ${{ runner.temp }}/msbuild-test-action-*/probe/**/*.json
            ${{ runner.temp }}/msbuild-test-action-*/probe/**/*.log
            ${{ runner.temp }}/starlark-extensions-*/**/*.log
            ${{ runner.temp }}/starlark-extensions-*/**/*.json
            ${{ runner.temp }}/starlark-extensions-*/**/BUILD.bazel
            ${{ runner.temp }}/configured-execution-*/probe/**/*.json
            ${{ runner.temp }}/configured-execution-*/probe/**/*.log
            ${{ runner.temp }}/graph-private-adapter-*/**/*.json
            ${{ runner.temp }}/graph-private-adapter-*/**/*.log
            ${{ runner.temp }}/starlark-core-*/*.log
            ${{ runner.temp }}/starlark-core-*/generated/BUILD.bazel
            ${{ runner.temp }}/starlark-core-*/generated/MODULE.bazel
            ${{ runner.temp }}/starlark-repository-*/*.log
            ${{ runner.temp }}/starlark-explicit-*/probe/*.log
            ${{ runner.temp }}/starlark-explicit-*/probe/report.json
            ${{ runner.temp }}/starlark-explicit-*/probe/workspace/BUILD.bazel
            ${{ runner.temp }}/starlark-explicit-*/probe/workspace/MODULE.bazel
            ${{ runner.temp }}/msbuild-graph-cache-*/probe/*.log
            ${{ runner.temp }}/msbuild-graph-cache-*/probe/*.json
            ${{ runner.temp }}/msbuild-graph-cache-*/probe/evidence/**
            ${{ runner.temp }}/graph-handoff-*/**/*.json
            ${{ runner.temp }}/graph-handoff-*/**/*.log
            ${{ runner.temp }}/graph-discovery-*/**/*.json
            ${{ runner.temp }}/graph-discovery-*/**/*.log
            ${{ runner.temp }}/msbuild-e2e-bazel-*/probe/*.log
            ${{ runner.temp }}/msbuild-e2e-binary-*/probe/*.log
            ${{ runner.temp }}/msbuild-e2e-binary-*/probe/report.json
          if-no-files-found: ignore
